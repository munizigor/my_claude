name: 💡 Nova funcionalidade
description: Proposta de funcionalidade ou melhoria
title: "[Feat]: "
labels: ["tipo: funcionalidade", "status: triagem"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema / necessidade
      description: Qual problema real isto resolve? Quem sofre com ele hoje e como?
      placeholder: "Hoje o usuário X precisa fazer Y manualmente, o que causa Z..."
    validations:
      required: true

  - type: textarea
    id: contexto-negocio
    attributes:
      label: Contexto de negócio
      description: Em que processo/fluxo isto se encaixa? Referencie ./docs/processo-negocio.md se existir.
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: Solução proposta (opcional)
      description: Se já tem uma ideia de solução, descreva. Deixe em branco se quiser discutir primeiro.
    validations:
      required: false

  - type: textarea
    id: criterio-aceite
    attributes:
      label: Critério de aceite
      description: Como saberemos que está pronto? Liste condições verificáveis.
      placeholder: |
        - [ ] Dado X, quando Y, então Z
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: impacto-fluxo
    attributes:
      label: Muda o fluxo atual do usuário?
      description: Mudanças de fluxo exigem validação com usuário real antes do merge.
      options:
        - "Não — mudança invisível ao usuário"
        - "Sim — pequeno ajuste no fluxo existente"
        - "Sim — mudança significativa de fluxo"
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade sugerida
      description: Sugestão de quem abre a issue. A prioridade oficial é o campo Prioridade do Project, definido na triagem.
      options:
        - Alta
        - Média
        - Baixa
    validations:
      required: true
